formatVersion: "1.0"
updatedAt: "2026-09-14T21:50:00+09:00"
domain: ddl
kind: database

schema: task

tables:
  tasks: #TODO: TBD　
    name: タスク

    columns:
      taskId: #TODO: 自動登録（Function？　ULIDだから無理？）
        element: taskId
        notNull: true

      title:
        element: title
        notNull: true

      description:
        element: description

      createUser:
        element: userId

      taskPic:
        element: userId

      priority:
        element: priority
        notNull: true

      statusCode:
        element: taskStatus
        name: ステータスコード
        notNull: true

    primaryKey:
      - taskId

    indexes:
      - columns: #INFO: (検索条件)
          - column: statusCode
          - column: priority
            order: DESC
          - column: taskPic
            nulls: FIRST
          - column: taskId
      - columns: #INFO: 登録ユーザーで絞る
          - column: createUser
          - column: taskId

    foreignKeys:
      - columns:
          - statusCode
        reference: #INFO: PK
          table: statuses
          columns:
            - statusCode

  statuses: #TODO: TBD
    name: ステータス

    columns:
      statusCode:
        element: taskStatus
        name: ステータスコード
        notNull: true

      description:
        element: description
        notNull: true

    primaryKey:
      - statusCode
