formatVersion: "1.0"
updatedAt: "2026-09-14T21:50:00+09:00"
domain: ddl
kind: database

schema: order

audit:
  element: traceId

tables:
  orders: #TODO: TBD
    name: 受注

    columns:
      orderNo: #TODO: 自動採番（登録時にFunction：ORD-YYYYMMDD-999、登録日内連番）
        element: receivedOrderNo
        notNull: true

      orderDate:
        element: orderDate
        notNull: true
        default:
          expression: CURRENT_DATE

      orderPic:
        element: userId
        name: 受注担当者ID

      customerId:
        element: customerId
        notNull: true

      status: #TODO: 自動変更（order_details登録/変更時にFunction：、受注明細すべてが1/2/3であれば1/2/3、それ以外は4）
        element: orderStatus
        default: PREPARING
        notNull: true

      urgent:
        element: urgent
        notNull: true

      note:
        element: comment
        name: 備考

      desiredDeliveryTime:
        element: desiredDeliveryTime

    primaryKey:
      - orderNo

    indexes:
      - columns: #INFO: (検索条件)
          - column: orderPic
            nulls: LAST
          - column: customerId
          - column: orderNo
      - columns: #INFO: ステータスで絞る
          - column: status
          - column: orderNo
      - columns: #INFO: 緊急出荷
          - column: urgent
          - column: orderNo

  order_details: #TODO: TBD
    name: 受注明細

    columns:
      orderNo:
        element: receivedOrderNo
        notNull: true

      detailNo: #TODO: 自動採番（登録時にFunction：orderNo単位で連番）
        element: orderDetailNo
        notNull: true

      productNo:
        element: productNo
        notNull: true

      orderQuantity:
        element: quantity
        name: 受注数
        notNull: true

      shippingQuantity: #TODO: 自動変更（shipping_instructions登録時にFunction：登録数加算）、制約（orderQuantity >= shippingQuantity + shippingQuantity）
        element: quantity
        name: 出荷数
        notNull: true
        default: 0

      cancelQuantity: #TODO: 自動変更（cancel_instructions登録時にFunction：登録数加算）、制約（orderQuantity >= shippingQuantity + shippingQuantity）
        element: quantity
        name: キャンセル数
        notNull: true
        default: 0

      remainingQuantity: #TODO: 自動変更（登録/変更時にFunction：remainingQuantity = orderQuantity - shippingQuantity - cancelQuantity）
        element: quantity
        name: 受注残
        notNull: true

      status: #TODO: 自動変更（登録/変更時にFunction：1:受注数=受注残→準備中、2:受注残0/出荷0→キャンセル、3:受注残0/出荷≠0→完了、4:その他→対応中）
        element: orderStatus
        default: PREPARING
        notNull: true

      sellingPrice: #TODO: 制約（sellingPrice > costPrice）
        element: price
        notNull: true

      costPrice:
        element: price
        notNull: true

      profitRate: #TODO: 自動計算（登録/profitRate = （sellingPrice - costPrice) / sellingPrice * 100)
        element: profitRate
        notNull: true

    primaryKey:
      - orderNo
      - detailNo

    indexes:
      - columns: #INFO: 受注残がある順番
          - column: remainingQuantity
          - column: orderNo
          - column: detailNo
      - columns: #INFO: ステータスで絞る
          - column: status
          - column: orderNo
          - column: detailNo
      - columns: #INFO: 商品で絞る
          - column: productNo
          - column: orderNo
          - column: detailNo
      - columns: #INFO: 利益率で絞る
          - column: profitRate
            order: DESC
          - column: productNo
          - column: orderNo
          - column: detailNo

    foreignKeys:
      - columns:
          - orderNo
        reference: #INFO: PKの一部
          table: orders
          columns:
            - orderNo
        onDelete: CASCADE

  shipping_instructions: #TODO: TBD
    name: 出荷指示

    columns:
      orderShipmentId:
        element: orderShipmentId
        notNull: true
        sequence: true

      orderNo:
        element: receivedOrderNo
        notNull: true

      detailNo:
        element: orderDetailNo
        notNull: true

      operationDate:
        element: operationDate
        notNull: true
        default:
          expression: CURRENT_DATE

      personInCharge:
        element: userId
        name: 出荷担当者ID
        notNull: true

      quantity:
        element: quantity
        name: 出荷数
        notNull: true

      note:
        element: comment
        name: 備考

    primaryKey:
      - orderShipmentId

    uniqueConstraints:
      - columns: #INFO: 同一日に同一受注明細を複数回出荷してはいけない
          - operationDate
          - orderNo
          - detailNo

    indexes:
      - columns: #INFO: 受注明細順
          - column: orderNo
          - column: detailNo
          - column: operationDate
            order: DESC

    foreignKeys:
      - columns:
          - orderNo
          - detailNo
        reference: #INFO: PK
          table: order_details
          columns:
            - orderNo
            - detailNo

  cancel_instructions: #TODO: TBD
    name: キャンセル指示

    columns:
      orderCancelId:
        element: orderCancelId
        notNull: true
        sequence: true

      orderNo:
        element: receivedOrderNo
        notNull: true

      detailNo:
        element: orderDetailNo
        notNull: true

      operationDate:
        element: operationDate
        notNull: true
        default:
          expression: CURRENT_DATE

      personInCharge:
        element: userId
        name: キャンセル担当者ID
        notNull: true

      quantity:
        element: quantity
        name: キャンセル数
        notNull: true

      note:
        element: comment
        name: 備考

    primaryKey:
      - orderCancelId

    indexes:
      - columns: #INFO: 受注明細順
          - column: orderNo
          - column: detailNo
          - column: operationDate
            order: DESC

    foreignKeys:
      - columns:
          - orderNo
          - detailNo
        reference: #INFO: PK
          table: order_details
          columns:
            - orderNo
            - detailNo
