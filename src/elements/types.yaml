formatVersion: "1.0"
updatedAt: "2026-08-25T23:00:00+09:00"
domain: elements
kind: types

types:
  ID:
    name: ID
    description: 個体やリソースを識別するための、値集合を列挙しない文字列値
    capability:
      pathParameter: true
      generation: true
    constraints:
      required:
        - maxLength
      optional:
        - minLength
        - regex
    defaultAllowed:
      literal: false
      expressions: []
    postgresql:
      type: varchar
    openapi:
      type: string
    recommendations:
      - naming:
          - "*Id"
          - "*No"

  SEQUENCE:
    name: 連番
    description: 順序を表す連番の整数値
    capability:
      pathParameter: true
      generation: true
    constraints:
      required: []
      optional: []
    defaultAllowed:
      literal: false
      expressions: []
    validation:
      minimum: 1
    postgresql:
      type: bigint
    openapi:
      type: integer
      format: int64
    recommendations:
      - naming:
          - "*Id"
          - "*No"

  FIXED_STRING:
    name: 固定長文字列
    description: 固定長の文字列
    capability:
      pathParameter: false
      generation: false
    constraints:
      required:
        - length
      optional:
        - regex
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: varchar
    openapi:
      type: string
    recommendations: []

  STRING:
    name: 文字列
    description: 最大長を持つ可変長の文字列
    capability:
      pathParameter: false
      generation: false
    constraints:
      required:
        - maxLength
      optional:
        - minLength
        - regex
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: varchar
    openapi:
      type: string
    recommendations: []

  TEXT:
    name: テキスト
    description: 最大長を定めない文字列
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional:
        - minLength
        - regex
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: text
    openapi:
      type: string
    recommendations: []

  INTEGER:
    name: 整数
    description: 整数値
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional:
        - minimum
        - maximum
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: bigint
    openapi:
      type: integer
      format: int64
    recommendations: []

  DECIMAL:
    name: 実数
    description: 実数値
    capability:
      pathParameter: false
      generation: false
    constraints:
      required:
        - precision
        - scale
      optional:
        - minimum
        - maximum
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: numeric
    openapi:
      type: number
    recommendations: []

  BOOLEAN:
    name: 真偽値
    description: 真または偽の値
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional: []
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: boolean
    openapi:
      type: boolean
    recommendations:
      - naming:
          - "is*"
          - "has*"
          - "can*"
          - "should*"

  CODE:
    name: コード値
    description: 分類や識別に用いる、運用中に値集合が変化し得る有限かつ離散的な文字列値
    capability:
      pathParameter: true
      generation: false
    constraints:
      required:
        - maxLength
      optional:
        - minLength
        - regex
    defaultAllowed:
      literal: false
      expressions: []
    postgresql:
      type: varchar
    openapi:
      type: string
    recommendations:
      - naming:
          - "*Code"

  ENUM:
    name: 列挙型
    description: 定義時に値集合が固定される有限かつ離散的な値
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional: []
    defaultAllowed:
      literal: true
      expressions: []
    postgresql:
      type: enum
    openapi:
      type: string
    recommendations:
      - naming:
          - "*Type"

  DATE:
    name: 日付
    description: 日付値
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional: []
    defaultAllowed:
      literal: true
      expressions:
        - CURRENT_DATE
    postgresql:
      type: date
    openapi:
      type: string
      format: date
    recommendations:
      - naming:
          - "*Date"

  TIME:
    name: 時刻
    description: 時刻値
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional: []
    defaultAllowed:
      literal: true
      expressions:
        - CURRENT_TIME
    validation:
      regex: "^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$"
    postgresql:
      type: time
    openapi:
      type: string
    recommendations:
      - naming:
          - "*Time"

  DATETIME:
    name: 日時
    description: プロジェクトで定めたタイムゾーンにもとづく日時
    capability:
      pathParameter: false
      generation: false
    constraints:
      required: []
      optional: []
    defaultAllowed:
      literal: true
      expressions:
        - CURRENT_DATETIME
    postgresql:
      type: timestamp with time zone
    openapi:
      type: string
      format: date-time
    recommendations:
      - naming:
          - "*DateTime"
