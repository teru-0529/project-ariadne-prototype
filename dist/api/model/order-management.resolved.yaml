formatVersion: "1.0"

service:
  id: order-management
  name: 受注サービス
  description: |
    受注および顧客情報を管理するサービス。

parameters:
  receivedOrderNo:
    elementRef: $receivedOrderNo
    description: 受注番号。
    usages:
      - in: path
        name: received_order_no
        required: true

  orderPic:
    elementRef: $userId
    description: 受注担当者。
    example: U1234
    usages:
      - in: query
        name: order_pic
        required: false

  customerId:
    elementRef: $customerId
    description: 顧客ID。
    usages:
      - in: query
        name: customer_id
        required: false

  traceId:
    elementRef: $traceId
    description: トレースID。
    usages:
      - in: header
        name: X-Trace-ID
        required: true

  detailNo:
    elementRef: $orderDetailNo
    description: 受注明細番号。
    usages:
      - in: path
        name: detail_no
        required: true

  limit:
    builtIn: pagination
    usages:
      - in: query
        name: limit
        required: false

  offset:
    builtIn: pagination
    usages:
      - in: query
        name: offset
        required: false

schemas:
  Order:
    origin:
      kind: resource
      resourceKind: mainResource
      resource: Order

    name: 受注
    description: |
      受注情報を表すメインリソース。

    properties:
      orderNo:
        elementRef: $receivedOrderNo
        required: true
        readOnly: true
        name: 受注番号
        description: 登録時に自動採番される受注番号。

      orderDate:
        elementRef: $orderDate
        required: true
        readOnly: true
        name: 受注日
        description: 登録時に自動設定される受注日。

      orderPic:
        elementRef: $userId
        required: true
        name: 受注担当者
        description: この受注を担当するユーザーのID。

      customerId:
        elementRef: $customerId
        required: true
        name: 顧客ID

      orderStatus:
        elementRef: $orderStatus
        required: true
        readOnly: true
        name: 受注ステータス

      urgent:
        elementRef: $urgent
        required: true
        name: 至急

      notes:
        elementRef: $comment
        name: 摘要
        description: 受注に関する補足情報。
        example: 要注意顧客。

      desiredDeliveryTime:
        elementRef: $desiredDeliveryTime
        name: 希望納品時刻

  Order.Summary:
    origin:
      kind: variant
      resourceKind: mainResource
      resource: Order
      variant: Summary

    properties:
      orderNo:
        elementRef: $receivedOrderNo
        required: true
        readOnly: true
        name: 受注番号
        description: 登録時に自動採番される受注番号。

      orderDate:
        elementRef: $orderDate
        required: true
        readOnly: true
        name: 受注日
        description: 登録時に自動設定される受注日。

      orderPic:
        elementRef: $userId
        required: true
        name: 受注担当者
        description: この受注を担当するユーザーのID。

      customerId:
        elementRef: $customerId
        required: true
        name: 顧客ID

      orderStatus:
        elementRef: $orderStatus
        required: true
        readOnly: true
        name: 受注ステータス

      price:
        elementRef: $price
        name: 金額
        description: 受注の合計金額。

      detailCount:
        elementRef: $quantity
        readOnly: true
        name: 明細件数
        description: 受注明細の件数。

  Order.DateUpdate:
    origin:
      kind: variant
      resourceKind: mainResource
      resource: Order
      variant: DateUpdate

    properties:
      orderDate:
        elementRef: $orderDate
        required: true
        readOnly: true
        name: 受注日
        description: 登録時に自動設定される受注日。

  OrderDetail:
    origin:
      kind: resource
      resourceKind: subResource
      resource: OrderDetail
      parent: Order

    name: 受注明細
    description: |
      受注に紐づく明細情報を表すサブリソース。

    properties:
      detailNo:
        elementRef: $orderDetailNo
        required: true
        readOnly: true
        name: 明細番号
        description: 登録時に自動採番される明細番号。

      productNo:
        elementRef: $productNo
        required: true
        name: 商品番号

      quantity:
        elementRef: $quantity
        required: true
        name: 受注数

      shippingQuantity:
        elementRef: $quantity
        readOnly: true
        name: 出荷済数

      cancelQuantity:
        elementRef: $quantity
        readOnly: true
        name: キャンセル数

      remainingQuantity:
        elementRef: $quantity
        readOnly: true
        name: 受注残
        description: |
          受注数から出荷済数およびキャンセル数を差し引いた数量。

      sellingPrice:
        elementRef: $price
        required: true
        name: 販売単価

      costPrice:
        elementRef: $price
        readOnly: true
        name: 想定原価

      profitRate:
        elementRef: $profitRate
        readOnly: true
        name: 想定利益率

  OrderDetail.Summary:
    origin:
      kind: variant
      resourceKind: subResource
      resource: OrderDetail
      variant: Summary
      parent: Order

    properties:
      detailNo:
        elementRef: $orderDetailNo
        required: true
        readOnly: true
        name: 明細番号
        description: 登録時に自動採番される明細番号。

      productNo:
        elementRef: $productNo
        required: true
        name: 商品番号

      quantity:
        elementRef: $quantity
        required: true
        name: 受注数

      shippingQuantity:
        elementRef: $quantity
        readOnly: true
        name: 出荷済数

      cancelQuantity:
        elementRef: $quantity
        readOnly: true
        name: キャンセル数

      remainingQuantity:
        elementRef: $quantity
        readOnly: true
        name: 未出荷・未キャンセル数
        description: |
          受注数のうち、まだ出荷またはキャンセルされていない数量。
        example: 5

  Order.WithDetails:
    origin:
      kind: parentVariant
      resourceKind: mainResource
      resource: Order
      variant: WithDetails
      definedBy: OrderDetail

    properties:
      orderNo:
        elementRef: $receivedOrderNo
        required: true
        readOnly: true
        name: 受注番号
        description: 登録時に自動採番される受注番号。

      orderDate:
        elementRef: $orderDate
        required: true
        readOnly: true
        name: 受注日
        description: 登録時に自動設定される受注日。

      orderPic:
        elementRef: $userId
        required: true
        name: 受注担当者
        description: この受注を担当するユーザーのID。

      customerId:
        elementRef: $customerId
        required: true
        name: 顧客ID

      orderStatus:
        elementRef: $orderStatus
        required: true
        readOnly: true
        name: 受注ステータス

      urgent:
        elementRef: $urgent
        required: true
        name: 至急

      notes:
        elementRef: $comment
        name: 摘要
        description: 受注に関する補足情報。
        example: 要注意顧客。

      desiredDeliveryTime:
        elementRef: $desiredDeliveryTime
        name: 希望納品時刻

      details:
        array:
          schemaRef: $OrderDetail
        required: true
        minItems: 1
        name: 受注明細
        description: |
          受注に含まれる明細情報。

  OrderShipment:
    origin:
      kind: action
      action: OrderShipment
      resource: OrderShipment
      parent: Order

    properties:
      shipmentId:
        elementRef: $orderShipmentId
        readOnly: true
        required: true

      customerId:
        elementRef: $customerId
        required: true

      details:
        array:
          schemaRef: $OrderShipmentDetail
        minItems: 1
        required: true
        name: 出荷対象明細
        description: |
          出荷対象となる受注明細。
          同一顧客であれば複数受注にまたがって指定できる。

  OrderShipmentDetail:
    origin:
      kind: action
      action: OrderShipment
      resource: OrderShipmentDetail
      parent: Order

    properties:
      orderNo:
        elementRef: $receivedOrderNo
        required: true

      detailNo:
        elementRef: $orderDetailNo
        required: true

      quantity:
        elementRef: $quantity
        required: true
        name: 出荷数量
        description: 今回出荷する数量。

  Cancellation:
    origin:
      kind: action
      action: Cancellation
      resource: Cancellation
      parent: Order

    properties:
      details:
        array:
          schemaRef: $CancellationDetail
        minItems: 1
        required: true
        name: キャンセル対象明細

  CancellationDetail:
    origin:
      kind: action
      action: Cancellation
      resource: CancellationDetail
      parent: Order

    properties:
      detailNo:
        elementRef: $orderDetailNo
        required: true

      quantity:
        elementRef: $quantity
        required: true
        name: キャンセル数量
        description: 今回キャンセルする数量。

  ExportCondition:
    origin:
      kind: custom
      custom: ExportOrders
      resource: ExportCondition

    properties:
      customerId:
        elementRef: $customerId

      orderDateFrom:
        elementRef: $orderDate
        name: 受注日From

      orderDateTo:
        elementRef: $orderDate
        name: 受注日To

  ExportResult:
    origin:
      kind: custom
      custom: ExportOrders
      resource: ExportResult

    properties:
      downloadUrl:
        elementRef: $url
        required: true
        readOnly: true
        name: ダウンロードURL

  ValidationError:
    origin:
      kind: custom
      custom: ExportOrders
      resource: ValidationError

    properties:
      errorDescription:
        elementRef: $description
        required: true
        readOnly: true
        name: エラー内容

apis:
  /orders:
    get:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Order

      operationId: orders-get
      tag: Order
      summary: 受注一覧取得
      description: |
        条件に一致する受注情報を取得する。

      requestHeaders:
        - parameterRef: $traceId

      queryParameters:
        - parameterRef: $orderPic
        - parameterRef: $customerId
        - parameterRef: $limit
        - parameterRef: $offset

      response:
        "200":
          description: 正常終了
          headers:
            Has-More:
              builtIn: pagination
          array:
            schemaRef: $Order.Summary
        default:
          builtIn: error

    post:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Order

      operationId: orders-post
      tag: Order
      summary: 受注登録
      description: |
        受注情報と1件以上の受注明細を登録する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $Order.WithDetails
        exampleOverride:
          details:
            - productNo: P123456
              quantity: 10
              sellingPrice: 1000
            - productNo: P654321
              quantity: 5
              sellingPrice: 1200

      response:
        "201":
          description: 正常終了
          headers:
            Location:
              builtIn: location
          schemaRef: $Order
        default:
          builtIn: error

      externalDocs:
        url: ./docs/order-create.md
        description: 受注登録の詳細仕様

  /orders/{received_order_no}:
    pathParameters:
      - parameterRef: $receivedOrderNo

    get:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Order

      operationId: orders-received-order-no-get
      tag: Order
      summary: 受注取得
      description: |
        指定された受注番号の受注情報を取得する。

      requestHeaders:
        - parameterRef: $traceId

      response:
        "200":
          description: 正常終了
          schemaRef: $Order
        default:
          builtIn: error

    put:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Order

      operationId: orders-received-order-no-put
      tag: Order
      summary: 受注更新
      description: |
        指定された受注情報を全体更新する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $Order

      response:
        "200":
          description: 正常終了
          schemaRef: $Order
        default:
          builtIn: error

  /orders/{received_order_no}/date:
    pathParameters:
      - parameterRef: $receivedOrderNo

    patch:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Order

      operationId: orders-received-order-no-date-patch
      tag: Order
      summary: 受注日変更
      description: |
        指定された受注の受注日を変更する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $Order.DateUpdate

      response:
        "200":
          description: 正常終了
          schemaRef: $Order
        default:
          builtIn: error

  /orders/{received_order_no}/details:
    pathParameters:
      - parameterRef: $receivedOrderNo

    get:
      origin:
        kind: resource
        resourceKind: subResource
        resource: OrderDetail
        parent: Order

      operationId: orders-received-order-no-details-get
      tag: Order
      summary: 受注明細一覧取得
      description: |
        指定された受注に紐づく明細情報を取得する。

      requestHeaders:
        - parameterRef: $traceId

      response:
        "200":
          description: 正常終了
          array:
            schemaRef: $OrderDetail.Summary
        default:
          builtIn: error

    post:
      origin:
        kind: resource
        resourceKind: subResource
        resource: OrderDetail
        parent: Order

      operationId: orders-received-order-no-details-post
      tag: Order
      summary: 受注明細追加
      description: |
        指定された受注に1件以上の受注明細を追加する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        array:
          schemaRef: $OrderDetail
        minItems: 1

      response:
        "201":
          description: 正常終了
          schemaRef: $Order
        default:
          builtIn: error

  /orders/{received_order_no}/details/{detail_no}:
    pathParameters:
      - parameterRef: $receivedOrderNo
      - parameterRef: $detailNo

    delete:
      origin:
        kind: resource
        resourceKind: subResource
        resource: OrderDetail
        parent: Order

      operationId: orders-received-order-no-details-detail-no-delete
      tag: Order
      summary: 受注明細削除
      description: |
        指定された受注明細を削除する。

      requestHeaders:
        - parameterRef: $traceId

      response:
        "204":
          description: 正常終了
        default:
          builtIn: error

  /order-shipments:
    post:
      origin:
        kind: action
        action: OrderShipment
        parent: Order

      operationId: order-shipments-post
      tag: Order
      summary: 受注出荷反映
      description: |
        出荷・在庫領域で確定した出荷情報を受注領域へ反映する。
        対象となる受注明細の出荷済数を増加し、受注残を減少させる。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $OrderShipment

      response:
        "201":
          description: 正常終了
          array:
            schemaRef: $OrderDetail.Summary
        default:
          builtIn: error

  /orders/{received_order_no}/cancellations:
    pathParameters:
      - parameterRef: $receivedOrderNo

    post:
      origin:
        kind: action
        action: Cancellation
        parent: Order

      operationId: orders-received-order-no-cancellations-post
      tag: Order
      summary: 受注キャンセル登録
      description: |
        指定された受注に対して明細単位のキャンセルを登録する。
        対象となる受注明細のキャンセル数を増加し、受注残を減少させる。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $Cancellation

      response:
        "201":
          description: 正常終了
          array:
            schemaRef: $OrderDetail.Summary
        default:
          builtIn: error

  /orders/export:
    post:
      origin:
        kind: custom
        custom: ExportOrders

      operationId: orders-export-post
      tag: Order
      summary: 受注エクスポート
      description: |
        指定された条件に一致する受注情報をファイル化し、
        一時ストレージに保存したダウンロード用URLを返却する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $ExportCondition

      response:
        "202":
          description: エクスポート正常終了
          schemaRef: $ExportResult
        "400":
          description: 入力チェックエラー
          array:
            schemaRef: $ValidationError
        "409":
          description: 処理コンフリクト
        default:
          builtIn: error

  /health:
    get:
      builtIn: health
      operationId: health-get
      tag: System
      summary: ヘルスチェック

      response:
        "200":
          description: 正常終了
        default:
          builtIn: error

  /version:
    get:
      builtIn: version
      operationId: version-get
      tag: System
      summary: バージョン取得

      response:
        "200":
          description: 正常終了
          builtIn: version
        default:
          builtIn: error

elementRefs:
  - $receivedOrderNo
  - $userId
  - $customerId
  - $traceId
  - $orderDetailNo
  - $orderDate
  - $orderStatus
  - $urgent
  - $comment
  - $desiredDeliveryTime
  - $productNo
  - $quantity
  - $price
  - $profitRate
  - $orderShipmentId
  - $url
  - $description
