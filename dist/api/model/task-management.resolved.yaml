formatVersion: "1.0"

service:
  id: task-management
  name: Task管理サービス
  description: |
    タスクを管理するサービス。

parameters:
  taskId:
    elementRef: $taskId
    description: タスクID
    usages:
      - in: path
        name: task_id
        required: true

  taskStatus:
    elementRef: $taskStatus
    description: タスクの状態
    usages:
      - in: query
        name: task_status
        required: false

  priority:
    elementRef: $priority
    description: 優先度
    usages:
      - in: query
        name: priority
        required: false

  taskPic:
    elementRef: $userId
    description: タスク担当ユーザー
    usages:
      - in: query
        name: task_pic
        required: false

  traceId:
    elementRef: $traceId
    description: トレースID。
    usages:
      - in: header
        name: X-Trace-ID
        required: true

  limit:
    builtIn: pagination
    usages:
      - in: query
        name: limit
        required: false

  offset:
    builtIn: pagination
    usages:
      - in: query
        name: offset
        required: false

schemas:
  Task:
    origin:
      kind: resource
      resourceKind: mainResource
      resource: Task

    name: タスク
    description: |
      タスク情報を表すメインリソース。

    properties:
      taskId:
        elementRef: $taskId
        required: true
        readOnly: true

      title:
        elementRef: $title
        required: true

      description:
        elementRef: $description

      createUser:
        elementRef: $userId
        required: true
        name: 登録ユーザー
        description: タスク登録ユーザー

      taskPic:
        elementRef: $userId
        name: 担当者
        description: タスク担当ユーザー

      taskStatus:
        elementRef: $taskStatus
        required: true

      priority:
        elementRef: $priority
        required: true

      urgent:
        elementRef: $urgent
        required: true

apis:
  /tasks:
    get:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Task

      operationId: tasks-get
      tag: Task
      summary: タスク一覧取得
      description: |
        条件に一致するタスク情報を取得する。

      requestHeaders:
        - parameterRef: $traceId

      queryParameters:
        - parameterRef: $taskStatus
        - parameterRef: $priority
        - parameterRef: $taskPic
        - parameterRef: $limit
        - parameterRef: $offset

      responses:
        "200":
          description: 正常終了
          headers:
            Has-More:
              builtIn: pagination
          array:
            schemaRef: $Task
        default:
          builtIn: error

    post:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Task

      operationId: tasks-post
      tag: Task
      summary: タスク登録
      description: |
        タスク情報を登録する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $Task

      responses:
        "201":
          description: 正常終了
          headers:
            Location:
              builtIn: location
              example: /tasks/01F8MECHZX3TBDSZ7XRADM79XE
        default:
          builtIn: error

  /tasks/{task_id}:
    pathParameters:
      - parameterRef: $taskId

    get:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Task

      operationId: tasks-task-id-get
      tag: Task
      summary: タスク取得
      description: |
        指定されたタスクIDのタスク情報を取得する。

      requestHeaders:
        - parameterRef: $traceId

      responses:
        "200":
          description: 正常終了
          schemaRef: $Task
        default:
          builtIn: error

    put:
      origin:
        kind: resource
        resourceKind: mainResource
        resource: Task

      operationId: tasks-task-id-put
      tag: Task
      summary: タスク更新
      description: |
        指定されたタスク情報を全体更新する。

      requestHeaders:
        - parameterRef: $traceId

      request:
        schemaRef: $Task

      responses:
        "200":
          description: 正常終了
        default:
          builtIn: error

elementRefs:
  - $taskId
  - $taskStatus
  - $priority
  - $userId
  - $traceId
  - $title
  - $description
  - $urgent
