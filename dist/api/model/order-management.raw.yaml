formatVersion: "1.0"

service:
  id: order-management
  name: 受注サービス
  description: |
    受注および顧客情報を管理するサービス。
  requestHeaders:
    - requestId

parameters:
  receivedOrderNo:
    element: receivedOrderNo
    description: 受注番号。

  orderPic:
    element: userId
    description: 受注担当者。
    example: U1234

  customerId:
    element: customerId
    description: 顧客ID。

  requestId:
    element: requestId
    headerName: X-Request-ID
    description: リクエストを識別するID。

  detailNo:
    element: orderDetailNo
    description: 受注明細番号。

resources:
  Order:
    name: 受注
    description: |
      受注情報を表すメインリソース。

    properties:
      orderNo:
        element: receivedOrderNo
        required: true
        readOnly: true
        name: 受注番号
        description: 登録時に自動採番される受注番号。

      orderDate:
        element: orderDate
        required: true
        readOnly: true
        name: 受注日
        description: 登録時に自動設定される受注日。

      orderPic:
        element: userId
        required: true
        name: 受注担当者
        description: この受注を担当するユーザーのID。

      customerId:
        element: customerId
        required: true
        name: 顧客ID

      orderStatus:
        element: orderStatus
        required: true
        readOnly: true
        name: 受注ステータス

      urgent:
        element: urgent
        required: true
        name: 至急

      notes:
        element: comment
        name: 摘要
        description: 受注に関する補足情報。
        example: 要注意顧客。

      desiredDeliveryTime:
        element: desiredDeliveryTime
        name: 希望納品時刻

    variants:
      Summary:
        exclude:
          - urgent
          - notes
          - desiredDeliveryTime

        add:
          price:
            element: price
            name: 金額
            description: 受注の合計金額。

          detailCount:
            element: quantity
            readOnly: true
            name: 明細件数
            description: 受注明細の件数。

      DateUpdate:
        include:
          - orderDate

    api:
      collection:
        path: /orders

        get:
          summary: 受注一覧取得

          description: |
            条件に一致する受注情報を取得する。

          pagination: true

          queryParameters:
            - orderPic
            - customerId

          response:
            array:
              resource: Order
              variant: Summary

      member:
        path: /orders/{received_order_no}
        pathParameters:
          - receivedOrderNo

        get:
          summary: 受注取得

          description: |
            指定された受注番号の受注情報を取得する。

          response:
            resource: Order

        put:
          summary: 受注更新

          description: |
            指定された受注情報を全体更新する。

          request:
            resource: Order

          response:
            resource: Order

      date:
        path: /orders/{received_order_no}/date
        pathParameters:
          - receivedOrderNo

        patch:
          summary: 受注日変更

          description: |
            指定された受注の受注日を変更する。

          request:
            resource: Order
            variant: DateUpdate

          response:
            resource: Order

  OrderDetail:
    parent: Order
    name: 受注明細
    description: |
      受注に紐づく明細情報を表すサブリソース。

    properties:
      detailNo:
        element: orderDetailNo
        required: true
        readOnly: true
        name: 明細番号
        description: 登録時に自動採番される明細番号。

      productNo:
        element: productNo
        required: true
        name: 商品番号

      quantity:
        element: quantity
        required: true
        name: 受注数

      shippingQuantity:
        element: quantity
        readOnly: true
        name: 出荷済数

      cancelQuantity:
        element: quantity
        readOnly: true
        name: キャンセル数

      remainingQuantity:
        element: quantity
        readOnly: true
        name: 受注残
        description: |
          受注数から出荷済数およびキャンセル数を差し引いた数量。

      sellingPrice:
        element: price
        required: true
        name: 販売単価

      costPrice:
        element: price
        readOnly: true
        name: 想定原価

      profitRate:
        element: profitRate
        readOnly: true
        name: 想定利益率

    variants:
      Summary:
        exclude:
          - sellingPrice
          - costPrice
          - profitRate

        overrides:
          remainingQuantity:
            name: 未出荷・未キャンセル数
            description: |
              受注数のうち、まだ出荷またはキャンセルされていない数量。

    parentVariants:
      WithDetails:
        add:
          details:
            array:
              resource: OrderDetail
            name: 受注明細
            description: |
              受注に含まれる明細情報。

    api:
      createOrder:
        path: /orders

        post:
          summary: 受注登録

          description: |
            受注情報と1件以上の受注明細を登録する。

          request:
            resource: Order
            variant: WithDetails
            overrides:
              details:
                required: true
                minItems: 1

          response:
            resource: Order

          externalDocs:
            url: ./docs/order-create.md
            description: 受注登録の詳細仕様

      details:
        path: /orders/{received_order_no}/details
        pathParameters:
          - receivedOrderNo

        get:
          summary: 受注明細一覧取得

          description: |
            指定された受注に紐づく明細情報を取得する。

          response:
            array:
              resource: OrderDetail
              variant: Summary

        post:
          summary: 受注明細追加

          description: |
            指定された受注に1件以上の受注明細を追加する。

          request:
            array:
              resource: OrderDetail
              minItems: 1

          response:
            resource: Order

      detail:
        path: /orders/{received_order_no}/details/{detail_no}
        pathParameters:
          - receivedOrderNo
          - detailNo

        delete:
          summary: 受注明細削除

          description: |
            指定された受注明細を削除する。

actions:
  OrderShipment:
    name: 受注出荷反映
    description: |
      出荷・在庫領域で確定した出荷情報を受注領域へ反映する。

    resources:
      OrderShipment:
        properties:
          shipmentId:
            element: orderShipmentId
            readOnly: true
            required: true

          customerId:
            element: customerId
            required: true

          details:
            array:
              resource: OrderShipmentDetail
              minItems: 1
            required: true
            name: 出荷対象明細
            description: |
              出荷対象となる受注明細。
              同一顧客であれば複数受注にまたがって指定できる。

      OrderShipmentDetail:
        properties:
          orderNo:
            element: receivedOrderNo
            required: true

          detailNo:
            element: orderDetailNo
            required: true

          quantity:
            element: quantity
            required: true
            name: 出荷数量
            description: 今回出荷する数量。

    api:
      collection:
        path: /order-shipments

        post:
          summary: 受注出荷反映

          description: |
            出荷・在庫領域で確定した出荷情報を受注領域へ反映する。
            対象となる受注明細の出荷済数を増加し、受注残を減少させる。

          request:
            resource: OrderShipment

          response:
            array:
              resource: OrderDetail
              variant: Summary

  Cancellation:
    name: 受注キャンセル
    description: |
      1つの受注に対する明細単位のキャンセルを登録する。

    resources:
      Cancellation:
        properties:
          details:
            array:
              resource: CancellationDetail
              minItems: 1
            required: true
            name: キャンセル対象明細

      CancellationDetail:
        properties:
          detailNo:
            element: orderDetailNo
            required: true

          quantity:
            element: quantity
            required: true
            name: キャンセル数量
            description: 今回キャンセルする数量。

    api:
      collection:
        path: /orders/{received_order_no}/cancellations
        pathParameters:
          - receivedOrderNo

        post:
          summary: 受注キャンセル登録

          description: |
            指定された受注に対して明細単位のキャンセルを登録する。
            対象となる受注明細のキャンセル数を増加し、受注残を減少させる。

          request:
            resource: Cancellation

          response:
            array:
              resource: OrderDetail
              variant: Summary

customs:
  ExportOrders:
    name: 受注エクスポート
    description: |
      条件に一致する受注情報をファイルとして出力する特殊API。
      出力ファイルは一時ストレージへ保存し、
      APIはダウンロード用URLを返却する。

    resources:
      ExportCondition:
        properties:
          customerId:
            element: customerId

          orderDateFrom:
            element: orderDate
            name: 受注日From

          orderDateTo:
            element: orderDate
            name: 受注日To

      ExportResult:
        properties:
          downloadUrl:
            element: url
            required: true
            readOnly: true
            name: ダウンロードURL

    api:
      export:
        path: /orders/export

        post:
          tags:
            - Order

          summary: 受注エクスポート

          description: |
            指定された条件に一致する受注情報をファイル化し、
            一時ストレージに保存したダウンロード用URLを返却する。

          request:
            resource: ExportCondition

          response:
            status: 201
            resource: ExportResult
